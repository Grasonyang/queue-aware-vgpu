# HAMi configuration for the current DGX Spark / GB10 environment.
#
# GB10 exposes unified memory and NVML cannot report a normal discrete-GPU
# memory size. HAMi 2.10.0 supports a preconfigured value for this case.
devicePlugin:
  preConfiguredDeviceMemory: 131072
  deviceSplitCount: 10
  deviceMemoryScaling: 1
  deviceCoreScaling: 1

scheduler:
  # Keep k3s' default scheduler. HAMi's separate auxiliary profile handles
  # GPU Pods without replacing the cluster scheduler.
  kubeScheduler:
    enabled: true
    image:
      registry: registry.k8s.io
      repository: kube-scheduler
      tag: v1.35.5
  forceOverwriteDefaultScheduler: true
  leaderElect: false
  replicas: 1
  admissionWebhook:
    enabled: true
    failurePolicy: Ignore
