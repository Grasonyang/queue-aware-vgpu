apiVersion: v1
kind: Namespace
metadata:
  name: research
---
apiVersion: v1
kind: Pod
metadata:
  name: hami-gpu-smoke
  namespace: research
  labels:
    queue-aware-vgpu.io/workload: smoke
spec:
  restartPolicy: Never
  containers:
    - name: cuda
      image: nvidia/cuda:13.2.0-base-ubuntu24.04
      command:
        - /bin/bash
        - -lc
        - nvidia-smi -L && sleep 120
      resources:
        limits:
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: "8192"
          nvidia.com/gpucores: "20"
