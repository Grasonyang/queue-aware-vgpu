apiVersion: v1
kind: Pod
metadata:
  name: queue-gated-batch
  namespace: research
  annotations:
    queue-aware-vgpu.io/queue: batch
  labels:
    queue-aware-vgpu.io/experiment: fairness
spec:
  schedulingGates:
    - name: queue-aware-vgpu.io/admission
  restartPolicy: Never
  containers:
    - name: workload
      image: nvidia/cuda:13.2.0-base-ubuntu24.04
      command: ["/bin/sh", "-c"]
      args:
        - nvidia-smi -L; sleep 120
      resources:
        limits:
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: "8192"
          nvidia.com/gpucores: "20"
