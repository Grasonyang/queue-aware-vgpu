# GB10/HAMi reference capacity is 131072 MiB per physical device. These
# requests are deliberately expressed in MiB and stay portable across the
# ten logical HAMi replicas: small=6.25%, medium=12.5%, large=25%.
apiVersion: v1
kind: Pod
metadata:
  name: burst-small-1
  namespace: research
  annotations:
    queue-aware-vgpu.io/queue: interactive
  labels:
    queue-aware-vgpu.io/scenario: burst
spec:
  schedulingGates:
    - name: queue-aware-vgpu.io/admission
  restartPolicy: Never
  containers:
    - name: workload
      image: nvidia/cuda:13.2.0-base-ubuntu24.04
      command: ["/bin/sh", "-c"]
      args: ["nvidia-smi -L; sleep 45"]
      resources:
        limits:
          nvidia.com/gpu: "1"
          nvidia.com/gpumem: "8192"
          nvidia.com/gpucores: "10"
---
