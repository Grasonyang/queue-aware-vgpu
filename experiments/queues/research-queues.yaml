apiVersion: v1
kind: Namespace
metadata:
  name: research
---
apiVersion: queue-aware-vgpu.io/v1alpha1
kind: VGPUQueue
metadata:
  name: interactive
  namespace: research
spec:
  weight: 4
  maxRunning: 8
  overcommit:
    enabled: true
    minRatio: 1.0
    maxRatio: 1.2
---
apiVersion: queue-aware-vgpu.io/v1alpha1
kind: VGPUQueue
metadata:
  name: batch
  namespace: research
spec:
  weight: 1
  maxRunning: 10
  overcommit:
    enabled: true
    minRatio: 1.0
    maxRatio: 1.1
